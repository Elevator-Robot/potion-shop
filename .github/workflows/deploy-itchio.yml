name: Build and publish to itch.io

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to itch.io (main branch only)
        type: boolean
        default: false

permissions:
  contents: read

# Never interrupt a Butler upload with a newer commit.
concurrency:
  group: itchio-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Check and export Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install matching Godot and Web export templates
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$editor.zip" "$release/$editor.zip"
          curl --fail --location --retry 3 --output "$templates" "$release/$templates"
          # Official release asset SHA-256 digests; update with GODOT_VERSION.
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $editor.zip" | sha256sum --check -
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $templates" | sha256sum --check -
          unzip -q "$editor.zip"
          chmod +x "$editor"
          ln -s "$RUNNER_TEMP/godot/$editor" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          unzip -j -q "$templates" 'templates/web*.zip' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          "./$editor" --version

      - name: Check game and native co-op
        run: python3 tools/check.py --network

      - name: Export single-threaded browser build
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          for file in index.html index.js index.wasm index.pck; do
            test -s "build/web/$file"
          done

      - name: Install browser smoke-test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/web-smoke" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/web-smoke/node_modules/.bin/playwright" install --with-deps chromium

      - name: Smoke-test exported game in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/web-smoke/node_modules
        run: |
          set -euo pipefail
          mkdir -p build/web-smoke
          python3 -m http.server --bind 127.0.0.1 --directory build/web 8000 > build/web-smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tools/check_web.cjs

      - name: Save browser smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: potion-shop-web-smoke
          path: build/web-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save browser build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: potion-shop-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish html5 channel
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Deliberately separate from Bound Souls' target configuration.
      ITCHIO_TARGET: ${{ vars.POTION_SHOP_ITCHIO_TARGET }}
    steps:
      - name: Validate Potion Shop destination
        run: |
          set -euo pipefail
          if [[ ! "$ITCHIO_TARGET" =~ ^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Set repository variable POTION_SHOP_ITCHIO_TARGET to the verified itch.io username/game-slug (not a URL or channel)."
            exit 1
          fi

      # Only the tested artifact reaches this job; no project code is executed
      # with the itch.io publishing credential, and PRs never enter this job.
      - name: Download tested browser build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: potion-shop-web
          path: build/web

      - name: Install Butler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/butler"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/butler.zip" \
            https://github.com/itchio/butler/releases/download/v15.32.0/butler-linux-amd64.zip
          echo "5db7b053fc9b578b86ffaf3520a12b952eb95c9225171cc5720dfbc9fe4574b3  $RUNNER_TEMP/butler.zip" | sha256sum --check -
          # Release ZIPs contain a linux-amd64/ directory; flatten it while
          # keeping Butler and its shared libraries together.
          unzip -j -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" -V

      - name: Upload to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo "::error::Add the ITCHIO_API_KEY Actions secret authorized to publish Potion Shop."
            exit 1
          fi
          "$RUNNER_TEMP/butler/butler" push build/web "$ITCHIO_TARGET:html5" --userversion "$GITHUB_SHA"
